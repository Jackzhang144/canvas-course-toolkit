[project]
name = "canvas-course-toolkit"
version = "1.0.0"
description = "Canvas 课程自动化工具包：同步课件、跟踪截止、辅助作业提交（面向任何学校/任何专业）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["canvas", "lms", "instructure", "coursework", "automation", "agent-skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/Jackzhang144/canvas-course-toolkit"
Issues = "https://github.com/Jackzhang144/canvas-course-toolkit/issues"

# 用 uv 跑时可以把这些当作命令直接调用（uv run canvas doctor 等）
[project.scripts]
canvas = "scripts.cli:main"
canvas-summary = "scripts.course_summary:main"
canvas-submit = "scripts.submit:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
