name: tests

# 全部测试都是离线的：不联网、不需要 Canvas 令牌。
# 所以任何人 fork 之后都能直接看到绿灯，不用配任何 secret。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # macOS 上跑一份就够，不必铺满矩阵
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 同步依赖
        run: uv sync --dev

      - name: 语法自检
        run: uv run python -m py_compile scripts/*.py tests/*.py

      - name: 离线测试（不联网、无需令牌）
        run: uv run --dev pytest -q

      - name: 端到端冒烟（假 Canvas 服务器）
        run: uv run python tests/test_smoke_offline.py

      - name: CLI 可用性
        run: |
          uv run canvas --help
          uv run canvas-summary --help
          uv run canvas-submit --help

      - name: 初始化流程冒烟（不写仓库根的 .env）
        run: |
          # 注意：配置未就绪时 init 会**故意**返回 1（表示"还差步骤"，供代理判断）。
          # GitHub 的 run 步骤默认 `bash -e`，而 `cmd; rc=$?` 在 -e 下仍会终止脚本
          # （bash 不会因为下一行读 $? 就放过失败）——必须写成 `cmd || rc=$?`。
          # 用仓库内的临时路径，避免在 CI 里生成真 .env 干扰后面的守卫检查。

          # 1) --check 必须只读：不创建任何文件
          rc=0; uv run canvas init --check --env-path .tmp-init/case-a/.env || rc=$?
          test "$rc" = "1" || { echo "✗ --check 在未配置时应返回 1（还差步骤），实际 $rc"; exit 1; }
          test ! -e .tmp-init/case-a/.env || { echo "✗ --check 不该创建文件"; exit 1; }

          # 2) 全新环境 init：应创建 .env 并返回 1（仍缺内容）
          rc=0; uv run canvas init --env-path .tmp-init/case-b/.env || rc=$?
          test "$rc" = "1" || { echo "✗ 未填凭据时 init 应返回 1，实际 $rc"; exit 1; }
          test -f .tmp-init/case-b/.env || { echo "✗ init 应创建 .env"; exit 1; }
          grep -q "CANVAS_HOST" .tmp-init/case-b/.env || { echo "✗ .env 缺少键"; exit 1; }

          # 3) 幂等：再跑一次内容不得变化（绝不许覆盖已有令牌）
          before=$(shasum .tmp-init/case-b/.env | cut -d' ' -f1)
          uv run canvas init --env-path .tmp-init/case-b/.env >/dev/null || true
          after=$(shasum .tmp-init/case-b/.env | cut -d' ' -f1)
          test "$before" = "$after" || { echo "✗ 重复 init 改动了 .env"; exit 1; }

          # 4) 填好真实格式的凭据后应就绪（退出码 0）
          printf 'CANVAS_HOST="https://demo.instructure.com"\nCANVAS_API_TOKEN="0123456789abcdefghijklmnopqrstuvwxyz"\n' > .tmp-init/case-c.env
          uv run canvas init --check --env-path .tmp-init/case-c.env >/dev/null \
            || { echo "✗ 配置齐全时 --check 应返回 0"; exit 1; }

          rm -rf .tmp-init
          echo "✓ init 幂等、--check 只读、就绪时退出码为 0"

      - name: 缺凭据时应当给出中文引导（而不是崩栈）
        run: |
          set +e
          out=$(uv run canvas doctor 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = "2" || { echo "期望退出码 2，实际 $code"; exit 1; }
          echo "$out" | grep -q "CANVAS_API_TOKEN" || { echo "提示里应说明缺哪个变量"; exit 1; }
          echo "$out" | grep -q "Access Token" || { echo "提示里应告诉用户去哪拿令牌"; exit 1; }

      - name: 检查 skills 两份镜像一致
        run: diff -r .dsh/skills .agents/skills

      - name: 检查没有误提交敏感文件
        run: |
          # 允许 CourseFiles/README.md、Assignments/README.md、LearningSummaries/README.md|TEMPLATE.md
          # 其余一律不该入库：.env、以及任何在第一层子目录里的真实课程内容/作业
          bad=0
          git ls-files | grep -E '(^|/)\.env$' && bad=1
          git ls-files | grep -E '^CourseFiles/.+/' | grep -v '^CourseFiles/README\.md$' && bad=1
          git ls-files | grep -E '^Assignments/.+/' | grep -v '^Assignments/README\.md$' && bad=1
          git ls-files | grep -E '^LearningSummaries/.+/' \
            | grep -vE '^LearningSummaries/(README|TEMPLATE)\.md$' && bad=1
          test "$bad" = "0" || { echo "✗ 有不该入库的文件被提交了"; exit 1; }
          echo "✓ 未提交 .env，也未提交课程资料/作业/学习总结内容"

      - name: 检查没有泄露个人身份信息
        run: |
          # 起因：LICENSE 里曾误写真实姓名，而脱敏自检漏掉了它
          # （当时只按学号/域名/课号过滤，把"看起来正常的署名"放过了）。
          #
          # 本步骤**不硬编码任何人的姓名/学号/学校域名**——否则等于把要保护的信息
          # 写进公开仓库（这正是本次踩到的第二个坑）。这里只用通用规则：
          #   1) 署名只允许 GitHub 账号名（noreply 邮箱形式）
          #   2) 常见学生邮箱域名与"Copyright ... 非账号名"的署名
          # 仓库特有的敏感关键词请放在本地脚本里，不要写进 CI。
          fail=0

          # 1) LICENSE 版权行只允许 GitHub 账号名（本项目为 JackZhang144）
          if git ls-files | grep -v '^\.github/' | xargs grep -InE \
            'Copyright \(c\).*' 2>/dev/null | grep -vE 'JackZhang144'; then
            echo "✗ LICENSE 署名不是预期的 GitHub 账号名"; fail=1
          fi

          # 2) 不留个人邮箱（只允许 GitHub 的 noreply 地址）
          hits=$(git ls-files | grep -v '^\.github/' | xargs grep -InoE \
            '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' 2>/dev/null \
            | grep -v 'users.noreply.github.com' \
            | grep -vE '(example\.(com|org)|instructure\.com|你的|your-)' || true)
          if [ -n "$hits" ]; then echo "✗ 命中疑似个人邮箱："; echo "$hits"; fail=1; fi

          # 3) 文档与示例里不得出现真实的校内主机名（示例一律用 *.example.edu / demo.*）
          hits2=$(git ls-files | grep -v '^\.github/' | xargs grep -InoE \
            '(canvas|elearning|lms|moodle)\.(example|edu|ac)\.[a-z.]+' 2>/dev/null || true)
          if [ -n "$hits2" ]; then echo "✗ 命中疑似真实校内域名："; echo "$hits2"; fail=1; fi

          test "$fail" = "0" || exit 1
          echo "✓ 署名合规、无个人邮箱、无真实校内域名"
